<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcane Wilds</title>
<link rel="stylesheet" href="src/ui.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  #boot-error { position: fixed; left: 16px; bottom: 16px; color: #ffb4a8; font: 13px monospace;
                white-space: pre-wrap; z-index: 100; max-width: 90vw; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="boot-error"></div>
<script type="module" src="src/main.js"></script>
<script>
  window.addEventListener('error', e => {
    const el = document.getElementById('boot-error');
    if (el) el.textContent += (e.message || e) + '\n';
  });
</script>
</body>
</html>
